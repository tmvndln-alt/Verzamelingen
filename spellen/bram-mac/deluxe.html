let AC=null,master=null,musicGain=null,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=SAVE.muted?0:0.55;master.connect(AC.destination);

function tone(f,dur,type,vol,slide,delay,dest){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.05);}
function noise(dur,vol,freq,delay,dest,at){if(!AC||!noiseBuf)return;const t=(at!=null?at:AC.currentTime)+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1000;f.Q.value=0.8;const g=AC.createGain();g.gain.setValueAtTime(vol||.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+dur+0.05);}

function note(m,t,d,type,vol){const f=440*Math.pow(2,(m-69)/12);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d+0.05);}
function startMusic(){if(!AC)return;musicOn=true;mNext=AC.currentTime+0.1;mStep=0;if(!mTimer)mTimer=setInterval(schedMusic,30);}

function schedMusic(){if(!AC)return;if(!musicOn||G.paused||G.state!=='playing'){mNext=AC.currentTime+0.05;return;}
  const sd=60/(138+G.level*4)/2;
  while(mNext<AC.currentTime+0.15){const i=mStep,bar=Math.floor(i/8),s=i%8;const root=[45,41,43,40][bar];

    mStep=(mStep+1)%32;mNext+=sd;}

function floorY(i,x){const f=floors[i];if(f.x2===f.x1)return f.y1;return f.y1+(f.y2-f.y1)*(x-f.x1)/(f.x2-f.x1);}

function buildLevel(n){
  G.level=n;LV=LEVELS[n];TH=THEMES[n];const rnd=mulberry(1234+n*777);
  NF=LV.N;BOT=584;TOP=165;const sp=(BOT-TOP)/(NF-1);floors=[];
  for(let i=0;i<NF;i++){const base=BOT-i*sp;const dir=((NF-1-i)%2===0)?1:-1;
    if(i===0){floors.push({x1:0,x2:W,y1:BOT,y2:BOT,dir,conv:0});continue;}

    if(dir===1)f={x1:30,x2:880,y1:base-s/2,y2:base+s/2,dir,conv:0};else f={x1:80,x2:930,y1:base+s/2,y2:base-s/2,dir,conv:0};

  ladders=[];

function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const x=c.getContext('2d');x.scale(2,2);return [c,x];}
function hx(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mixc(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function cs(c,a){return'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:a)+')';}
function shd(c,k){return[Math.min(255,c[0]*k),Math.min(255,c[1]*k),Math.min(255,c[2]*k)];}
const DAY=[.95,1,.62,.32,.12,.62,.45,.22,.85,.12];
let GRAIN=null;
function grain(){if(GRAIN)return GRAIN;const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');const d=x.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=10+Math.random()*14;}x.putImageData(d,0,0);GRAIN=c;return c;}
function makeBG(th,n){
  const [c,x]=makeCanvas(W,PH);const rnd=mulberry(500+n*13);
  const day=DAY[n]!=null?DAY[n]:.8,night=day<.35;const hor=hx(th.sky[2]),mid=hx(th.sky[1]),topc=hx(th.sky[0]);

  if(e.code==='KeyP'||e.code==='Escape'){if(G.state==='playing')G.paused=!G.paused;}
  if(e.code==='KeyM')setMute(!SAVE.muted);
  if(e.code==='Enter'){const b=G.ui.find(b=>b.main);if(b)b.a();}});
window.addEventListener('keyup',e=>{const k=KMAP[e.code];if(k)kb[k]=0;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='playing')G.paused=true;});
function toggleFS(){const d=document.documentElement;try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{const r=(d.requestFullscreen||d.webkitRequestFullscreen);if(r){const pr=r.call(d);if(pr&&pr.catch)pr.catch(()=>{});}}}catch(e){}}

function dust(x,y,n,col){for(let i=0;i<n;i++)parts.push({x,y,vx:(R()-.5)*2.4,vy:-R()*1.6,life:25+R()*15,max:40,c:col||'rgba(200,190,170,.8)',s:2+R()*3,g:.05});}
function sparkBurst(x,y,n,cols){for(let i=0;i<n;i++){const a=R()*7,s=1+R()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:30+R()*25,max:55,c:cols[i%cols.length],s:1.5+R()*2.5,g:.12,glow:true});}}
function firework(list,x,y){const cols=[['#ff5d8f','#ffd1e0'],['#5df0ff','#d6fbff'],['#ffd23f','#fff2b8'],['#8dff6a','#e3ffd8'],['#c78bff','#efe0ff']][Math.floor(R()*5)];
  for(let i=0;i<60;i++){const a=i/60*Math.PI*2,s=2+R()*2.4;list.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:55+R()*25,max:80,c:cols[i%2],s:2+R()*1.5,g:.04,glow:true,drag:.97});}}
function addPop(x,y,text,col){pops.push({x,y,text,life:70,c:col||'#fff'});}
function addScore(v,x,y){G.score+=v;if(x!=null)addPop(x,y,'+'+v);
  if(G.score>=G.nextLife){G.nextLife+=10000;if(G.lives<5){G.lives++;addPop(P.x,P.y-50,'EXTRA LEVEN!','#7dff8a');SFX.pick();}}}
function updParts(list){for(let i=list.length-1;i>=0;i--){const p=list[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;if(p.drag){p.vx*=p.drag;p.vy*=p.drag;}if(--p.life<=0)list.splice(i,1);}}

// ================== UPDATE ==================
let acc=0,last=performance.now();
function loop(now){let dt=Math.min(100,now-last);last=now;acc+=dt;let n=0;while(acc>=1000/60&&n<6){update();acc-=1000/60;n++;}if(n>=6)acc=0;render();requestAnimationFrame(loop);}
function update(){G.t++;
  updWeather();updParts(parts);updParts(bgParts);
  for(let i=pops.length-1;i>=0;i--){pops[i].y-=.6;if(--pops[i].life<=0)pops.splice(i,1);}
  if(G.shake>0.1)G.shake*=.88;else G.shake=0;
  if(G.flash>0)G.flash-=.04;
  clouds.forEach(c=>{c.x+=c.sp;if(c.x>W+20)c.x=-260*c.s;});
  fogs.forEach(f=>{f.x+=f.sp;if(f.x>W+f.r)f.x=-f.r;if(f.x<-f.r)f.x=W+f.r;});
  if(TH.fireworks&&(G.state==='playing'||G.state==='title')&&R()<.012){firework(bgParts,100+R()*760,60+R()*200);}
  if(G.state==='playing'){if(G.paused)return;if(G.intro>0){G.intro--;jumpEdge=false;return;}stepGame();}
  else if(G.state==='dying'){G.deadT++;if(G.deadT===110){G.lives--;if(G.lives<=0){G.state='gameover';SAVE.hi=Math.max(SAVE.hi,G.score);save();stopMusic();}else{resetActors();G.state='playing';}}}
  else if(G.state==='clear'){G.clearT++;if(G.clearT>50&&G.tally>0){const d=Math.min(G.tally,100);G.tally-=d;G.bonus=G.tally;addScore(d);if(G.clearT%3===0)SFX.tick();}
    if(G.clearT%18===0)parts.push({x:430+R()*20,y:goalY-30,vx:(R()-.5)*.6,vy:-.8,life:70,max:70,c:'heart',s:7,g:0});}
  else if(G.state==='victory'){G.vT++;if(G.t%22===0){firework(parts,100+R()*760,80+R()*300);SFX.firework();}}
}
function stepGame(){const k=keysNow();
  updPlayer(k);updNails();updVillain();updBarrels();updSparks();updKobolds();updCrane();updItems();
  if(++G.bonusTick>=120){G.bonusTick=0;G.bonus=Math.max(0,G.bonus-100);if(G.bonus===0)die(true);}
  if(TH.storm&&R()<.004){G.flash=1;lightning=makeBolt();SFX.thunder();}
  if(G.t%50===0&&R()<.5)SFX.fire&&0;
}
function die(force){if(G.state!=='playing')return;if(!force){if(P.inv>0)return;if(P.shield){P.shield=false;P.inv=110;SFX.robotHit();G.shake=5;addPop(P.x,P.y-50,'SCHILD KAPOT!','#7fe0ff');sparkBurst(P.x,P.y-16,24,['#7fe0ff','#fff']);return;}}G.state='dying';G.deadT=0;SFX.die();G.shake=9;sparkBurst(P.x,P.y-14,26,['#ffe066','#fff','#ff9f43']);}
function onLadder(f,x,dirUp){for(const l of ladders){if(Math.abs(l.x-x)<10&&(dirUp?l.lo===f:l.hi===f))return l;}return null;}
function updPlayer(k){const p=P;
  if(p.hammer>0)p.hammer--;if(p.inv>0)p.inv--;if(p.speedT>0)p.speedT--;if(p.turboT>0)p.turboT--;if(p.blockMsg>0)p.blockMsg--;const SPD=p.speedT>0?2.8:1.9;
  if(p.state==='ground'){const fl=floors[p.f];const mv=(k.R?1:0)-(k.L?1:0);
    if(mv)p.face=mv;p.x+=mv*SPD+fl.conv;
    let mn=fl.x1+8,mx=fl.x2-8;if(p.f===0){if(drumX<480)mn=70;else mx=890;}p.x=clamp(p.x,mn,mx);p.y=floorY(p.f,p.x);
    if(mv){p.walk+=.28;if(++p.stepT%14===0)SFX.land();}else p.walk=0;
    if(jumpEdge){p.state='jump';p.vy=-4.3;p.vx=mv*SPD;p.jumpId++;SFX.jump();}
    else if(k.U&&p.hammer<=0){const l=onLadder(p.f,p.x,true);if(l&&l.goal&&LV.boss&&!V.beaten){if(!p.blockMsg){addPop(p.x,p.y-52,'SCHAKEL EERST SLOOPBOT UIT!','#ff7060');SFX.bonk();p.blockMsg=80;}}else if(l){p.state='climb';p.lad=l;p.x=l.x;}}
    else if(k.D&&p.hammer<=0){const l=onLadder(p.f,p.x,false);if(l){p.state='climb';p.lad=l;p.x=l.x;p.y+=1;}}
  }else if(p.state==='jump'){const fl=floors[p.f];p.vy+=.27;p.x+=p.vx+fl.conv;
    let mn=fl.x1+8,mx=fl.x2-8;if(p.f===0){if(drumX<480)mn=70;else mx=890;}p.x=clamp(p.x,mn,mx);p.y+=p.vy;
    const up=floors[p.f+1];if(up&&p.vy<0&&p.x>up.x1&&p.x<up.x2){const cy=floorY(p.f+1,p.x)+14;if(p.y-33<cy){p.y=cy+33;p.vy=0;SFX.bonk();}}
    const fy=floorY(p.f,p.x);if(p.vy>0&&p.y>=fy){p.y=fy;p.state='ground';dust(p.x,p.y,5);SFX.land();}
  }else if(p.state==='climb'){const l=p.lad;const top=floorY(l.hi,l.x),bot=floorY(l.lo,l.x);
    if(k.U){p.y-=1.35;p.climb+=.25;}else if(k.D){p.y+=1.35;p.climb+=.25;}
    if(p.y<=top){p.y=top;p.f=l.hi;p.state='ground';if(l.goal)levelClear();}
    else if(p.y>=bot){p.y=bot;p.f=l.lo;p.state='ground';}}
  if(p.cool>0)p.cool--;if(p.shootT>0)p.shootT--;
  if((fireEdge||k.F)&&p.cool<=0&&p.state!=='climb'&&p.hammer<=0)shootNail();
  jumpEdge=false;fireEdge=false;}
function shootNail(){const off=(P.y-floorY(P.f,clamp(P.x,floors[P.f].x1,floors[P.f].x2)))-17;nails.push({x:P.x+P.face*16,f:P.f,off,vx:P.face*8,life:110,y:P.y-17});P.cool=P.turboT>0?5:15;P.shootT=12;muzzleT=4;SFX.nail();}
function updNails(){for(let i=nails.length-1;i>=0;i--){const n=nails[i];n.x+=n.vx;n.life--;const fl=floors[n.f];if(n.life<=0||n.x<fl.x1-6||n.x>fl.x2+6){nails.splice(i,1);continue;}n.y=floorY(n.f,clamp(n.x,fl.x1,fl.x2))+n.off;let hit=false;
  for(let j=barrels.length-1;j>=0;j--){const b=barrels[j];if(Math.abs(b.x-n.x)<BR+4&&Math.abs(b.y-n.y)<BR+6){barrels.splice(j,1);addScore(b.blue?400:200,b.x,b.y-14);SFX.smash();G.shake=Math.max(G.shake,3);sparkBurst(b.x,b.y,18,b.blue?['#7fe0ff','#fff']:['#ff9a35','#ffd27a','#fff']);dust(b.x,b.y,8,'rgba(140,90,40,.8)');hit=true;break;}}
  if(!hit)for(let j=sparks.length-1;j>=0;j--){const sp=sparks[j];if(Math.abs(sp.x-n.x)<12&&Math.abs(sp.y-9-n.y)<14){sparks.splice(j,1);addScore(300,sp.x,sp.y-20);SFX.smash();sparkBurst(sp.x,sp.y-9,20,['#ffb238','#fff']);hit=true;break;}}
  if(!hit)for(const kb of kobs){if(kb.state!=='die'&&Math.abs(kb.x-n.x)<11&&n.y>kb.y-36&&n.y<kb.y+2){hurtKob(kb,1);hit=true;break;}}
  if(!hit&&n.f===NF-1&&Math.abs(n.x-V.x)<38){hit=true;if(V.down>0){SFX.bonk();}else{V.hp--;V.flash=1;SFX.robotHit();sparkBurst(n.x,n.y,10,['#fff','#ffd27a','#8ad8ff']);addScore(50,n.x,n.y-12);
    if(V.hp<=0&&LV.boss){V.beaten=true;V.down=1e9;V.hp=0;V.throwT=-1;addScore(5000,V.x,floorY(NF-1,V.x)-115);addPop(V.x+60,floorY(NF-1,V.x)-135,'SLOOPBOT VERSLAGEN!','#7dff8a');SFX.robotDown();G.shake=14;for(let q=0;q<4;q++)sparkBurst(V.x+(R()-.5)*60,floorY(NF-1,V.x)-40-R()*60,30,['#ffd27a','#fff','#ff6a1f']);barrels.length=0;}
    else if(V.hp<=0){V.down=420;V.hp=V.maxHp;V.throwT=-1;addScore(1000,V.x,floorY(NF-1,V.x)-115);addPop(V.x+60,floorY(NF-1,V.x)-130,'SLOOPBOT UIT!','#7dff8a');SFX.robotDown();G.shake=9;sparkBurst(V.x,floorY(NF-1,V.x)-60,40,['#ffd27a','#fff','#ff6a1f']);}}}
  if(!hit&&crane&&(crane.state==='down'||crane.state==='hold')&&n.x>crane.x-23&&n.x<crane.x+23&&n.y>crane.y&&n.y<crane.y+26){hit=true;SFX.bonk();}
  if(hit)nails.splice(i,1);}}
function levelClear(){G.state='clear';G.clearT=0;G.tally=G.bonus;G.clearBonus=G.bonus;stopMusic();SFX.win();SAVE.unlocked=Math.max(SAVE.unlocked,Math.min(10,G.level+2));SAVE.hi=Math.max(SAVE.hi,G.score);save();V.angry=1;
  for(let i=0;i<4;i++)firework(parts,300+R()*360,100+R()*150);}
function updVillain(){V.t++;if(V.flash>0)V.flash=Math.max(0,V.flash-.08);
  if(V.beaten){if(V.t%6===0){const vy=floorY(NF-1,V.x);parts.push({x:V.x+(R()-.5)*30,y:vy-95,vx:(R()-.5)*.4,vy:-.7-R()*.5,life:60,max:60,c:'rgba(70,70,75,.7)',s:5,g:-.005});}if(V.t%50===0)sparkBurst(V.x+(R()-.5)*40,floorY(NF-1,V.x)-70,6,['#8ad8ff','#fff']);return;}
  if(V.down>0){V.down--;V.throwT=-1;if(V.down%5===0){const vy=floorY(NF-1,V.x);parts.push({x:V.x+(R()-.5)*30,y:vy-95,vx:(R()-.5)*.4,vy:-.7-R()*.5,life:60,max:60,c:'rgba(90,90,95,.7)',s:4,g:-.005});}if(V.down%40===0)sparkBurst(V.x+(R()-.5)*40,floorY(NF-1,V.x)-70,6,['#8ad8ff','#fff']);if(V.down===0){V.timer=50;addPop(V.x+60,floorY(NF-1,V.x)-130,'WEER ACTIEF!','#ff7060');}return;}
  if(V.throwT<0){if(--V.timer<=0){V.throwT=0;V.blue=R()<LV.blue;}}
  else{V.throwT++;if(V.throwT===40){const x=V.x+52;barrels.push({x,y:floorY(NF-1,x)-BR,f:NF-1,state:'roll',ang:0,blue:V.blue,sp:LV.bs*(V.blue?1.35:1)*(0.95+R()*.1),checked:new Set(),jid:-1,vx:0,vy:0});SFX.throw();G.shake=Math.max(G.shake,2);}
    if(V.throwT>=56){V.throwT=-1;V.timer=LV.int*(0.75+R()*.5)*(LV.boss&&V.hp<V.maxHp/2?.6:1);}}}
function updBarrels(){for(let i=barrels.length-1;i>=0;i--){const b=barrels[i];const fl=floors[b.f];
  if(b.state==='roll'){const prev=b.x;const v=fl.dir*b.sp+fl.conv;b.x+=v;b.ang+=v/BR;b.y=floorY(b.f,clamp(b.x,fl.x1,fl.x2))-BR;
    if(b.f>0){for(const l of ladders){if(l.goal||l.hi!==b.f)continue;if((prev-l.x)*(b.x-l.x)<=0&&!b.checked.has(l)){b.checked.add(l);if(R()<LV.lp*(b.blue?1.3:1)){b.state='ladder';b.lad=l;b.x=l.x;break;}}}
      if(b.state==='roll'&&(b.x>fl.x2+3||b.x<fl.x1-3)){b.state='fall';b.vy=0;b.vx=fl.dir*b.sp*.55;}}
    else{if((fl.dir>0&&b.x>=drumX-10)||(fl.dir<0&&b.x<=drumX+10)){barrels.splice(i,1);intoDrum();continue;}}
  }else if(b.state==='fall'){b.vy+=.3;b.x+=b.vx;b.y+=b.vy;b.ang+=b.vx/BR;const tf=b.f-1;if(b.y+BR>=floorY(tf,b.x)){b.f=tf;b.y=floorY(tf,b.x)-BR;b.state='hop';b.vy=-2.2;dust(b.x,b.y+BR,4);}}
  else if(b.state==='hop'){const v=floors[b.f].dir*b.sp;b.vy+=.3;b.y+=b.vy;b.x+=v;b.ang+=v/BR;const fy=floorY(b.f,b.x)-BR;if(b.vy>0&&b.y>=fy){b.y=fy;b.state='roll';b.checked=new Set();}}
  else if(b.state==='ladder'){b.y+=1.6*(b.blue?1.3:1);const by=floorY(b.lad.lo,b.lad.x)-BR;if(b.y>=by){b.y=by;b.f=b.lad.lo;b.state='hop';b.vy=-1.2;b.checked=new Set();}}
  // botsingen
  if(P.hammer>0&&hammerHit(b.x,b.y)){barrels.splice(i,1);addScore(b.blue?500:300,b.x,b.y-14);SFX.smash();G.shake=4;sparkBurst(b.x,b.y,18,b.blue?['#7fe0ff','#fff']:['#ff9a35','#ffd27a','#fff']);dust(b.x,b.y,8,'rgba(140,90,40,.8)');continue;}
  if(hitPlayer(b.x,b.y,BR-1.5)){die();return;}
  if(P.state==='jump'&&b.jid!==P.jumpId&&Math.abs(b.x-P.x)<14&&P.y<b.y-BR+3&&P.y>b.y-BR-60&&b.state==='roll'){b.jid=P.jumpId;addScore(100,P.x,P.y-36);SFX.score();}
  if(b.y>PH+40)barrels.splice(i,1);
 }}
function intoDrum(){SFX.fire();const dy=floorY(0,drumX);sparkBurst(drumX,dy-44,14,['#ffb238','#ff5a1f','#ffe08a']);
  if(sparks.length<LV.sm&&R()<LV.sc){sparks.push({x:drumX,y:dy,f:0,state:'hop',vy:-4,dir:drumX<480?1:-1,sp:.65+R()*.4,think:60,lad:null,t:0});}}
function updSparks(){for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t++;
  if(s.state==='hop'){s.vy+=.2;s.y+=s.vy;s.x+=s.dir*1.2;const fy=floorY(0,s.x);if(s.vy>0&&s.y>=fy){s.y=fy;s.state='walk';}}
  else if(s.state==='walk'){if(--s.think<=0){s.think=60+R()*100;if(s.f===P.f&&R()<.75)s.dir=Math.sign(P.x-s.x)||1;else s.dir=R()<.5?-1:1;}
    const fl=floors[s.f];const prev=s.x;s.x+=s.dir*s.sp+fl.conv*.5;let mn=fl.x1+12,mx=fl.x2-12;if(s.f===0){if(drumX<480)mn=65;else mx=895;}if(s.x<mn){s.x=mn;s.dir=1;}if(s.x>mx){s.x=mx;s.dir=-1;}s.y=floorY(s.f,s.x);
    for(const l of ladders){if(l.goal)continue;if((prev-l.x)*(s.x-l.x)<=0){if(l.lo===s.f&&P.f>s.f&&R()<.55){s.state='climb';s.lad=l;s.x=l.x;s.cd=-1;break;}if(l.hi===s.f&&P.f<s.f&&R()<.55){s.state='climb';s.lad=l;s.x=l.x;s.cd=1;break;}}}}
  else if(s.state==='climb'){const l=s.lad;s.y+=s.cd*.9;const top=floorY(l.hi,l.x),bot=floorY(l.lo,l.x);if(s.cd<0&&s.y<=top){s.y=top;s.f=l.hi;s.state='walk';s.think=20;}if(s.cd>0&&s.y>=bot){s.y=bot;s.f=l.lo;s.state='walk';s.think=20;}}
  if(R()<.5)parts.push({x:s.x+(R()-.5)*6,y:s.y-8,vx:(R()-.5)*.5,vy:-.6-R()*.6,life:18,max:18,c:R()<.5?'#ffb238':'#ff6a1f',s:1.5+R()*2,g:0,glow:true});
  if(P.hammer>0&&hammerHit(s.x,s.y-8)){sparks.splice(i,1);addScore(500,s.x,s.y-20);SFX.smash();sparkBurst(s.x,s.y-8,20,['#ffb238','#fff']);continue;}
  if(hitPlayer(s.x,s.y-8,8)){die();return;}}}
function updCrane(){if(!LV.crane)return;
  if(!crane){if(--craneT<=0&&P.f<NF){const tf=P.f;const fl=floors[tf];const x=clamp(P.x+(R()-.5)*180,fl.x1+40,fl.x2-40);crane={x,tf,state:'warn',t:0,y:-30};craneT=LV.crane*(0.8+R()*.4);SFX.warn();}return;}
  const c=crane;c.t++;const ty=floorY(c.tf,c.x)-26;
  if(c.state==='warn'){if(c.t%20===0)SFX.warn();if(c.t>85){c.state='down';}}
  else if(c.state==='down'){c.y+=5.5;if(c.y>=ty){c.y=ty;c.state='hold';c.t=0;SFX.thud();G.shake=5;dust(c.x-18,ty+26,6);dust(c.x+18,ty+26,6);}}
  else if(c.state==='hold'){if(c.t>45){c.state='up';}}
  else if(c.state==='up'){c.y-=3;if(c.y<-40)crane=null;}
  if(c.state==='down'||c.state==='hold'){const x1=c.x-22,x2=c.x+22,y1=c.y,y2=c.y+26;if(P.x+7>x1&&P.x-7<x2&&P.y-26<y2&&P.y-2>y1)die();}}
function updItems(){items.forEach(it=>{if(it.taken)return;const cy=it.type==='hammer'?it.y:it.y;if(Math.abs(P.x-it.x)<16&&Math.abs((P.y-14)-cy)<28){it.taken=true;
  if(it.pw){SFX.pick();sparkBurst(it.x,it.y,16,['#7fe0ff','#fff']);if(it.type==='schild'){P.shield=true;addPop(it.x,it.y-16,'SCHILD!','#7fe0ff');}else if(it.type==='laars'){P.speedT=600;addPop(it.x,it.y-16,'SNELLE SCHOENEN!','#9effa8');}else{P.turboT=600;addPop(it.x,it.y-16,'TURBO-NIETER!','#ffd23f');}}
  else if(it.type==='hammer'){P.hammer=560;SFX.pick();addPop(it.x,it.y-14,'SLOOPHAMER!','#ffd23f');}else{addScore(it.val,it.x,it.y-16);SFX.pick();sparkBurst(it.x,it.y,12,['#fff59a','#fff']);}}});}

function hurtKob(k,dmg){k.hp-=dmg;k.flash=8;k.x+=Math.sign(k.x-P.x)*3;if(k.hp<=0){k.state='die';k.dieT=0;addScore(500,k.x,k.y-44);SFX.smash();G.shake=Math.max(G.shake,4);sparkBurst(k.x,k.y-18,22,['#ff6a40','#ffd27a','#fff']);}else SFX.robotHit();}
function updKobolds(){const max=KOB[G.level]||0;
  if(max&&!V.beaten&&kobs.filter(k=>k.state!=='die').length<max&&--G.kobT<=0){G.kobT=360+R()*300;const f=NF-1;const x=clamp(V.x+90,floors[f].x1+30,floors[f].x2-30);kobs.push({x,y:floorY(f,x),f,state:'walk',dir:1,sp:.6+G.level*.035,hp:3,t:0,think:40,flash:0,lad:null,cd:0});addPop(x,floorY(f,x)-50,'KOBOLD!','#ff8a6a');SFX.throw();}
  for(let i=kobs.length-1;i>=0;i--){const s=kobs[i];s.t++;if(s.flash>0)s.flash--;
    if(s.state==='die'){if(++s.dieT>80)kobs.splice(i,1);continue;}
    if(s.state==='walk'){if(--s.think<=0){s.think=60+R()*90;if(s.f===P.f&&R()<.8)s.dir=Math.sign(P.x-s.x)||1;else s.dir=R()<.5?-1:1;}
      const fl=floors[s.f];const prev=s.x;s.x+=s.dir*s.sp+fl.conv*.5;let mn=fl.x1+14,mx=fl.x2-14;if(s.f===0){if(drumX<480)mn=70;else mx=890;}if(s.x<mn){s.x=mn;s.dir=1;}if(s.x>mx){s.x=mx;s.dir=-1;}s.y=floorY(s.f,s.x);
      for(const l of ladders){if(l.goal)continue;if((prev-l.x)*(s.x-l.x)<=0){if(l.lo===s.f&&P.f>s.f&&R()<.6){s.state='climb';s.lad=l;s.x=l.x;s.cd=-1;break;}if(l.hi===s.f&&P.f<s.f&&R()<.6){s.state='climb';s.lad=l;s.x=l.x;s.cd=1;break;}}}}
    else if(s.state==='climb'){const l=s.lad;s.y+=s.cd*.8;const top=floorY(l.hi,l.x),bot=floorY(l.lo,l.x);if(s.cd<0&&s.y<=top){s.y=top;s.f=l.hi;s.state='walk';s.think=20;}if(s.cd>0&&s.y>=bot){s.y=bot;s.f=l.lo;s.state='walk';s.think=20;}}
    if(P.hammer>0&&hammerHit(s.x,s.y-18)){s.hp=0;hurtKob(s,0);addScore(100,s.x,s.y-30);continue;}
    if(P.state==='jump'&&s.jid!==P.jumpId&&Math.abs(s.x-P.x)<14&&P.y<s.y-30&&s.state==='walk'){s.jid=P.jumpId;addScore(100,P.x,P.y-36);SFX.score();}
    if(hitPlayer(s.x,s.y-17,10)){die();return;}}}
function hitPlayer(cx,cy,r){if(G.state!=='playing')return false;const nx=clamp(cx,P.x-6.5,P.x+6.5),ny=clamp(cy,P.y-25,P.y-2);return (cx-nx)*(cx-nx)+(cy-ny)*(cy-ny)<r*r;}
function hammerHit(cx,cy){const hx=P.x+P.face*17,hy=P.y-18;return Math.abs(cx-hx)<21&&Math.abs(cy-hy)<24;}
function makeBolt(){const pts=[];let x=100+R()*760,y=0;while(y<PH*.6){pts.push([x,y]);x+=(R()-.5)*50;y+=20+R()*25;}return{pts,life:12};}
function updWeather(){if(TH.rain){weather.forEach(d=>{d.y+=d.s;d.x-=d.s*.25;if(d.y>PH){d.y=-20;d.x=R()*(W+100);}});}
  if(TH.snow){weather.forEach(f=>{f.y+=f.s;f.ph+=.03;f.x+=Math.sin(f.ph)*.4;if(f.y>PH){f.y=-5;f.x=R()*W;}});}

function star(c,x,y,r,col){c.save();c.fillStyle=col;c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr2=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}c.closePath();c.fill();c.restore();}

  else if(it.type==='helm'){const g=c.createLinearGradient(0,-8,0,4);g.addColorStop(0,'#fff6b0');g.addColorStop(1,'#e0a100');c.fillStyle=g;c.beginPath();c.ellipse(0,1,8,7,0,Math.PI,0);c.fill();rr(c,-10,0,20,3,1.5);c.fill();if(Math.floor(G.t/8)%4===0)star(c,5,-6,3,'#fff');}

function drawFlames(c){const dy=floorY(0,drumX)-40;c.save();c.globalCompositeOperation='lighter';

function drawConveyors(c){floors.forEach(f=>{if(!f.conv)return;const len=Math.hypot(f.x2-f.x1,f.y2-f.y1),a=Math.atan2(f.y2-f.y1,f.x2-f.x1);c.save();c.translate(f.x1,f.y1);c.rotate(a);
