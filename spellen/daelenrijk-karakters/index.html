import * as THREE from 'three';

// ===================== BASIS =====================
const W=960,SH=540,H=680;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let view={s:1,ox:0,oy:0,dpr:1};
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2.5);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);const s=Math.min(innerWidth/W,innerHeight/H);view={s,dpr,ox:(innerWidth-W*s)/2,oy:(innerHeight-H*s)/2};}
addEventListener('resize',resize);resize();
const FT='Cinzel, "Times New Roman", serif',FB='Alegreya, Georgia, serif';
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=Math.random;
function clamp(v,a,b){return v<a?a:v>b?b:v}function lerp(a,b,t){return a+(b-a)*t}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function hx(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mix(a,b,t){const A=hx(a),B=hx(b);return'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';}
function mkc(w,h){const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const x=c.getContext('2d');x.scale(2,2);return[c,x];}
function inPoly(x,y,p){let ins=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}

// ===================== AUDIO =====================
let AC=null,master=null,mus=null,amb=null,noiseBuf=null,muted=false;
try{muted=localStorage.getItem('daelen_mute')==='1';}catch(e){}
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.6;master.connect(AC.destination);mus=AC.createGain();mus.gain.value=.13;mus.connect(master);amb=AC.createGain();amb.gain.value=.5;amb.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;setInterval(schedMusic,40);startWater();}catch(e){AC=null}}
function pluck(f,t,d,vol,dest){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='triangle';o2.type='sawtooth';o.frequency.value=f;o2.frequency.value=f*1.003;fl.type='lowpass';fl.frequency.setValueAtTime(2600,t);fl.frequency.exponentialRampToValueAtTime(500,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);const g2=AC.createGain();g2.gain.value=.25;o.connect(fl);o2.connect(g2);g2.connect(fl);fl.connect(g);g.connect(dest||mus);o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);}
function tone(f,d,type,vol,slide,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
function noiseHit(d,vol,freq){if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+d+.05);}
const SFX={
  point:()=>{if(!AC)return;[784,988,1175,1568].forEach((f,i)=>pluck(f,AC.currentTime+i*.09,.6,.25,master));},
  pick:()=>{if(!AC)return;pluck(660,AC.currentTime,.3,.2,master);pluck(990,AC.currentTime+.07,.3,.18,master);},
  click:()=>tone(900,.04,'triangle',.06),
  thud:()=>{noiseHit(.25,.4,180);tone(90,.2,'sine',.3,-30);},
  munch:()=>{for(let i=0;i<5;i++)setTimeout(()=>noiseHit(.08,.25,900+R()*500),i*140);},
  snore:()=>tone(80,1,'sawtooth',.05,30),
  splash:()=>{noiseHit(.5,.25,1200);},
  win:()=>{if(!AC)return;[587,740,880,1175,880,1175,1480].forEach((f,i)=>pluck(f,AC.currentTime+i*.16,.9,.25,master));}
};
// luit-melodie in D dorisch
const MEL=[62,0,65,69,67,65,64,0,62,0,60,64,65,0,62,0, 69,0,72,69,67,65,67,0,69,67,65,64,62,0,0,0];
const BAS=[38,38,45,45,36,36,43,43];
let mStep=0,mNext=0;
function schedMusic(){if(!AC)return;if(G.state==='title'||muted){mNext=AC.currentTime+.1;return;}const sd=.27;if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.2){const n=MEL[mStep%32];if(n)pluck(440*Math.pow(2,(n-69)/12),mNext,1.1,.22);if(mStep%4===0){const b=BAS[Math.floor(mStep/4)%8];pluck(440*Math.pow(2,(b-69)/12),mNext,1.6,.3);pluck(440*Math.pow(2,(b+7-69)/12),mNext+sd*2,1.2,.16);}
    if(SCN&&SCN.birds&&R()<.05)chirp(mNext);mStep++;mNext+=sd;}}
function chirp(t){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';const f=2400+R()*1600;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*(R()<.5?1.4:.7),t+.08);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.1);o.connect(g);g.connect(amb);o.start(t);o.stop(t+.15);
  if(R()<.6){const t2=t+.12;const o2=AC.createOscillator(),g2=AC.createGain();o2.frequency.setValueAtTime(f*1.1,t2);o2.frequency.exponentialRampToValueAtTime(f*.8,t2+.07);g2.gain.setValueAtTime(.0001,t2);g2.gain.exponentialRampToValueAtTime(.04,t2+.01);g2.gain.exponentialRampToValueAtTime(.0001,t2+.08);o2.connect(g2);g2.connect(amb);o2.start(t2);o2.stop(t2+.1);}}
let waterGain=null;
function startWater(){const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;waterGain=AC.createGain();waterGain.gain.value=0;s.connect(f);f.connect(waterGain);waterGain.connect(amb);s.start();}
function setMute(m){muted=m;try{localStorage.setItem('daelen_mute',m?'1':'0')}catch(e){}if(master)master.gain.value=m?0:.6;}

// ===================== SCHILDERHULPJES =====================
function grainTex(){const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d');const d=x.createImageData(200,200);for(let i=0;i<d.data.length;i+=4){const v=R()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=14;}x.putImageData(d,0,0);return c;}
const GRAIN=grainTex();
function sky(c,top,mid,bot,h){const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,top);g.addColorStop(.6,mid);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,W,h);}
function sunGlow(c,x,y,r,col){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(255,240,200,0)');c.fillStyle=g;c.fillRect(0,0,W,SH);}
function cloud(c,x,y,s,rnd,lit,shade){for(let i=0;i<22;i++){const px=x+(rnd()-.5)*160*s,dc=Math.abs(px-x)/(80*s),py=y-rnd()*36*s*(1-dc*.6),r=(16+rnd()*26)*s*(1-dc*.4);const g=c.createRadialGradient(px-r*.25,py-r*.4,0,px,py,r);g.addColorStop(0,lit);g.addColorStop(.6,shade);g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(px,py,r,0,7);c.fill();}}
function ridge(c,base,amp,freq,col1,col2,seed,top){const rnd=mulberry(seed);const pts=[];let ph=rnd()*10;for(let x=-10;x<=W+10;x+=8){const y=base-amp*(.5+.5*Math.sin(x*freq+ph))-amp*.35*Math.sin(x*freq*2.7+ph*2)-rnd()*amp*.08;pts.push([x,y]);}
  const g=c.createLinearGradient(0,top||base-amp*1.5,0,base+40);g.addColorStop(0,col1);g.addColorStop(1,col2);c.fillStyle=g;c.beginPath();c.moveTo(-10,SH);pts.forEach(p=>c.lineTo(p[0],p[1]));c.lineTo(W+10,SH);c.closePath();c.fill();return pts;}
function mountains(c,base,hgt,col,haze,seed,snow){const rnd=mulberry(seed);let x=-40;c.save();while(x<W+40){const w=120+rnd()*180,h=hgt*(.5+rnd()*.6),px=x+w/2;
    const g=c.createLinearGradient(0,base-h,0,base);g.addColorStop(0,col);g.addColorStop(1,haze);c.fillStyle=g;c.beginPath();c.moveTo(x,base);c.lineTo(px-w*.08,base-h*.92);c.lineTo(px,base-h);c.lineTo(px+w*.12,base-h*.88);c.lineTo(x+w,base);c.fill();
    c.fillStyle='rgba(0,0,0,.08)';c.beginPath();c.moveTo(px,base-h);c.lineTo(px+w*.12,base-h*.88);c.lineTo(x+w,base);c.lineTo(px+w*.05,base);c.fill();
    if(snow){c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.moveTo(px-w*.08,base-h*.92+2);c.lineTo(px,base-h);c.lineTo(px+w*.12,base-h*.88+2);c.lineTo(px+w*.06,base-h*.8);c.lineTo(px,base-h*.85);c.lineTo(px-w*.05,base-h*.79);c.fill();}
    x+=w*.6+rnd()*40;}c.restore();}
function leafBall(c,x,y,r,cols,rnd,n){n=n||Math.floor(r*1.6);for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,d=Math.sqrt(rnd())*r,px=x+Math.cos(a)*d,py=y+Math.sin(a)*d*.85;const lr=r*(.18+rnd()*.18);const t=clamp((py-(y-r))/(2*r)+(px-x)/(4*r),0,1);
    const ci=Math.floor(t*(cols.length-1));c.fillStyle=cols[clamp(ci+(rnd()<.2?-1:0),0,cols.length-1)];c.beginPath();c.ellipse(px,py,lr,lr*.8,rnd()*3,0,7);c.fill();}
  for(let i=0;i<n*.25;i++){const a=-Math.PI*.75+rnd()*1.2,d=r*(.3+rnd()*.6);c.fillStyle='rgba(255,250,180,'+(.15+rnd()*.2)+')';c.beginPath();c.ellipse(x+Math.cos(a)*d,y+Math.sin(a)*d,r*.08,r*.06,rnd()*3,0,7);c.fill();}}
const LEAF=['#e6f08a','#a9cf55','#6fa83a','#4a8a2c','#2f6a22','#1d4a17','#11300f'];
const LEAFD=['#9fb86a','#6f9448','#4d7536','#355a28','#24421c','#152b12'];
function trunk(c,x,y,w,h,lean,dark){const g=c.createLinearGradient(x-w,0,x+w,0);g.addColorStop(0,dark?'#2a1c12':'#3a2716');g.addColorStop(.35,dark?'#5a4030':'#7a5a3a');g.addColorStop(.6,dark?'#4a3424':'#5e4428');g.addColorStop(1,'#20150c');c.fillStyle=g;
  c.beginPath();c.moveTo(x-w*1.5,y);c.quadraticCurveTo(x-w*.9,y-h*.1,x-w*.7+lean*.4,y-h*.5);c.lineTo(x-w*.45+lean,y-h);c.lineTo(x+w*.45+lean,y-h);c.quadraticCurveTo(x+w*.7+lean*.4,y-h*.5,x+w*.9,y-h*.1);c.lineTo(x+w*1.6,y);c.closePath();c.fill();
  c.strokeStyle='rgba(20,12,6,.45)';c.lineWidth=1;const rnd=mulberry(Math.round(x*3+y));for(let i=0;i<w*1.2;i++){const bx=x-w*.6+rnd()*w*1.2,by=y-rnd()*h;c.beginPath();c.moveTo(bx,by);c.quadraticCurveTo(bx+(rnd()-.5)*4,by-8,bx+(rnd()-.5)*3,by-14-rnd()*14);c.stroke();}
  c.strokeStyle='rgba(255,220,170,.12)';for(let i=0;i<w*.5;i++){const bx=x-w*.4+rnd()*w*.4,by=y-rnd()*h;c.beginPath();c.moveTo(bx,by);c.lineTo(bx,by-10-rnd()*10);c.stroke();}}
function tree(c,x,y,h,seed,o){o=o||{};const rnd=mulberry(seed);const w=h*.055*(o.thick||1);
  c.fillStyle='rgba(10,20,5,.35)';c.beginPath();c.ellipse(x+h*.15,y+2,h*.42,h*.07,0,0,7);c.fill();
  trunk(c,x,y,w,h*.62,(rnd()-.5)*w,o.dark);
  c.strokeStyle=o.dark?'#2a1c12':'#4a3420';c.lineCap='round';for(let i=0;i<5;i++){const a=-Math.PI/2+(rnd()-.5)*2.2,len=h*(.18+rnd()*.2),sx=x,sy=y-h*(.45+rnd()*.2);c.lineWidth=w*(.4+rnd()*.3);c.beginPath();c.moveTo(sx,sy);c.quadraticCurveTo(sx+Math.cos(a)*len*.5,sy+Math.sin(a)*len*.6,sx+Math.cos(a)*len,sy+Math.sin(a)*len);c.stroke();}
  const cols=o.cols||LEAF;const cx=x,cy=y-h*.72,cr=h*.36;
  const balls=[];for(let i=0;i<9;i++){const a=rnd()*Math.PI*2,d=cr*(.25+rnd()*.55);balls.push([cx+Math.cos(a)*d*1.15,cy+Math.sin(a)*d*.75,cr*(.38+rnd()*.25)]);}
  balls.sort((a,b)=>a[1]-b[1]);
  c.fillStyle=cols[cols.length-1];balls.forEach(b=>{c.beginPath();c.ellipse(b[0],b[1]+b[2]*.1,b[2],b[2]*.85,0,0,7);c.fill();});
  balls.forEach(b=>leafBall(c,b[0],b[1],b[2],cols,rnd));
  return{cx,cy,cr};}
function pine(c,x,y,h,col,col2){const w=h*.32;for(let i=0;i<5;i++){const ty=y-h+i*h*.17,bw=w*(.35+i*.17);const g=c.createLinearGradient(x-bw,0,x+bw,0);g.addColorStop(0,col2);g.addColorStop(.4,col);g.addColorStop(1,col2);c.fillStyle=g;c.beginPath();c.moveTo(x,ty);c.lineTo(x+bw,ty+h*.26);c.lineTo(x-bw,ty+h*.26);c.closePath();c.fill();}c.fillStyle='#3a2a1a';c.fillRect(x-h*.025,y-h*.12,h*.05,h*.12);}
function grass(c,poly,top,bot,y1,y2,seed,dens){const rnd=mulberry(seed);c.save();c.beginPath();poly.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.clip();
  const g=c.createLinearGradient(0,y1,0,y2);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,y1-50,W,y2-y1+100);
  for(let i=0;i<180;i++){const px=rnd()*W,py=y1+rnd()*(y2-y1);c.fillStyle='rgba('+(rnd()<.5?'30,60,10':'200,230,120')+','+(.05+rnd()*.08)+')';c.beginPath();c.ellipse(px,py,20+rnd()*60,4+rnd()*10,0,0,7);c.fill();}
  const n=(dens||1)*2600;for(let i=0;i<n;i++){const px=rnd()*W,py=y1+rnd()*(y2-y1);const t=(py-y1)/(y2-y1);const hgt=2+t*9+rnd()*4;c.strokeStyle=rnd()<.55?'rgba(40,80,20,'+(.35+rnd()*.4)+')':'rgba(170,210,90,'+(.3+rnd()*.4)+')';c.lineWidth=.6+t*.8;c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(px+(rnd()-.5)*3,py-hgt*.6,px+(rnd()-.5)*5,py-hgt);c.stroke();}
  c.restore();}
function dirtPath(c,pts,seed,col){const rnd=mulberry(seed);c.save();c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
  const ys=pts.map(p=>p[1]);const g=c.createLinearGradient(0,Math.min(...ys),0,Math.max(...ys));g.addColorStop(0,col?col[0]:'#a98a62');g.addColorStop(1,col?col[1]:'#7a5e3e');c.fillStyle=g;c.fill();c.clip();
  for(let i=0;i<500;i++){const px=rnd()*W,py=Math.min(...ys)+rnd()*(Math.max(...ys)-Math.min(...ys));const r=.6+rnd()*2.2;c.fillStyle=rnd()<.5?'rgba(60,40,20,.35)':'rgba(230,210,170,.35)';c.beginPath();c.ellipse(px,py,r*1.3,r,0,0,7);c.fill();}
  for(let i=0;i<40;i++){const px=rnd()*W,py=Math.min(...ys)+rnd()*(Math.max(...ys)-Math.min(...ys));const r=2+rnd()*4;const sg=c.createRadialGradient(px-r*.3,py-r*.4,0,px,py,r);sg.addColorStop(0,'#d8cbb4');sg.addColorStop(1,'#6e6050');c.fillStyle=sg;c.beginPath();c.ellipse(px,py,r*1.2,r*.75,0,0,7);c.fill();}
  c.restore();}
function flowers(c,x1,y1,x2,y2,n,seed,cols){const rnd=mulberry(seed);for(let i=0;i<n;i++){const px=x1+rnd()*(x2-x1),py=y1+rnd()*(y2-y1);const s=.6+(py-y1)/(y2-y1+1)*.8;c.strokeStyle='#3e6a24';c.lineWidth=.8;c.beginPath();c.moveTo(px,py);c.lineTo(px,py-6*s);c.stroke();c.fillStyle=cols[Math.floor(rnd()*cols.length)];for(let k=0;k<5;k++){const a=k*1.256;c.beginPath();c.arc(px+Math.cos(a)*1.6*s,py-6*s+Math.sin(a)*1.6*s,1.4*s,0,7);c.fill();}c.fillStyle='#ffe25a';c.beginPath();c.arc(px,py-6*s,.9*s,0,7);c.fill();}}
function stones(c,x,y,w,h,base,seed,bw,bh){const rnd=mulberry(seed);c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.fillStyle='#4a453c';c.fillRect(x,y,w,h);bw=bw||22;bh=bh||12;
  for(let row=0,yy=y;yy<y+h;row++,yy+=bh){for(let xx=x-(row%2?bw/2:0);xx<x+w;xx+=bw){const v=.82+rnd()*.3;const b=hx(base);c.fillStyle='rgb('+Math.round(b[0]*v)+','+Math.round(b[1]*v)+','+Math.round(b[2]*v)+')';rr(c,xx+1,yy+1,bw-2,bh-2,2);c.fill();
    c.fillStyle='rgba(255,255,240,.12)';c.fillRect(xx+2,yy+1.5,bw-5,1.5);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(xx+2,yy+bh-3,bw-4,1.5);

function makeScarecrow(){const g=new THREE.Group();const wd=std({map:TX.wood,roughness:.8});g.add(M(CYL(.05,.05,2.1,8),wd,0,1.05,0));const arm=M(CYL(.04,.04,1.6,8),wd,0,1.6,0);arm.rotation.z=Math.PI/2;g.add(arm);g.add(M(SPH(.22,14,10),mat(0xd8b878,.9),0,2.2,0));g.add(M(CYL(.28,.28,.03,18),mat(0x6a4a2a,.8),0,2.38,0));g.add(M(CYL(.15,.18,.22,14),mat(0x6a4a2a,.8),0,2.5,0));g.add(M(BOX(.5,.7,.2),std({map:clothTex('#6a7a9a','#5a6a8a',true,97,3),roughness:.95}),0,1.5,0));return g;}
function makeFountain(){const g=new THREE.Group();const st=TX.stone.clone();st.repeat.set(3,1);st.needsUpdate=true;const sm=std({map:st,bumpMap:st,bumpScale:1.5,roughness:.9});const pr=[[1.5,0],[1.6,.1],[1.6,.7],[1.45,.75],[1.35,.6],[1.35,.2]].map(p=>new THREE.Vector2(p[0],p[1]));g.add(M(new THREE.LatheGeometry(pr,32),sm,0,0,0));g.add(M(CYL(1.35,1.35,.02,28),std({color:0x3e7c9e,roughness:.05,metalness:.3,transparent:true,opacity:.9}),0,.5,0,false));g.add(M(CYL(.18,.25,1.3,12),sm,0,1.0,0));g.add(M(CYL(.5,.15,.15,16),sm,0,1.6,0));return g;}
function makeStump(){const g=new THREE.Group();const bm=std({map:TX.bark,roughness:.95});g.add(M(CYL(.55,.65,.9,16),bm,0,.45,0));g.add(M(CYL(.5,.5,.03,16),std({color:0xc8a070,roughness:.8}),0,.9,0));return g;}
function makeLantern(){const g=new THREE.Group();g.add(M(CYL(.1,.12,.04,6),std({color:0x3a3a3e,metalness:.7,roughness:.4}),0,.02,0));g.add(M(CYL(.08,.08,.22,8),new THREE.MeshStandardMaterial({color:0xffd890,emissive:0xffa040,emissiveIntensity:.8,transparent:true,opacity:.8}),0,.15,0,false));g.add(M(CYL(.01,.1,.07,8),std({color:0x3a3a3e,metalness:.7,roughness:.4}),0,.3,0));const r=M(new THREE.TorusGeometry(.06,.008,6,12,Math.PI),std({color:0x3a3a3e,metalness:.7}),0,.33,0);g.add(r);return g;}
function makePick(){const g=new THREE.Group();const wd=std({map:TX.wood,roughness:.8});const s=M(CYL(.025,.025,1.0,6),wd,0,.5,0);s.rotation.z=1.2;g.add(s);const hd=M(BOX(.55,.06,.06),std({color:0x8a8a92,metalness:.8,roughness:.3}),.45,.95,0);hd.rotation.z=1.2;g.add(hd);return g;}
function makeCrystals(){const g=new THREE.Group();const cm=new THREE.MeshStandardMaterial({color:0x7ad8ff,emissive:0x2a9aff,emissiveIntensity:1.2,roughness:.1,metalness:.3,transparent:true,opacity:.9});for(let i=0;i<9;i++){const c=M(new THREE.ConeGeometry(.12+R()*.12,.6+R()*.7,6),cm,(R()-.5)*1.4,.3,(R()-.5)*.5,false);c.rotation.z=(R()-.5)*.7;c.userData.noOutline=true;g.add(c);}const pl=new THREE.PointLight(0x5ab8ff,2,7,2);pl.position.y=.8;g.add(pl);g.userData.pl=pl;g.userData.noOutline=true;return g;}
function makeSeal(col){const g=new THREE.Group();const m=std({color:col||0xffd85a,emissive:col||0xffa800,emissiveIntensity:1.0,metalness:.7,roughness:.2});const d=M(CYL(.16,.16,.06,6),m,0,0,0,false);d.rotation.x=Math.PI/2;g.add(d);g.add(M(SPH(.07,10,8),std({color:0xfff5c0,emissive:0xffe080,emissiveIntensity:.9}),0,0,.04,false));const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:TX.glow,color:col||0xffd070,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.8}));gl.scale.set(1.1,1.1,1);g.add(gl);g.userData.spin=true;g.userData.noOutline=true;return g;}
function hitBox(sc,x,y,z,w,h,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({visible:false}));m.position.set(x,y,z);m.userData.noOutline=true;sc.add(m);return m;}
function hitSphere(sc,x,y,z,r){const m=new THREE.Mesh(new THREE.SphereGeometry(r,8,6),new THREE.MeshBasicMaterial({visible:false}));m.position.set(x,y,z);m.userData.noOutline=true;sc.add(m);return m;}
function scatterRocks(sc,n,seed,x1,x2,z1,z2,avoid,s0,s1){const r=mulberry(seed);for(let i=0;i<n;i++){const x=lerp(x1,x2,r()),z=lerp(z1,z2,r());if(avoid&&avoid(x,z))continue;const q=rock((s0||.15)+r()*((s1||.4)-(s0||.15)),seed+i);q.position.set(x,0,z);sc.add(q);}}
function dunes(sc,seed,col){const r=mulberry(seed);const m=std({color:col||0xe0c080,roughness:1});for(let i=0;i<9;i++){const d=M(SPH(5+r()*5,20,12,0,6.3,0,1.6),m,-26+i*7+r()*3,-.5,-18-r()*10);d.scale.set(1.6,.35+r()*.2,1);d.castShadow=false;sc.add(d);}}
function bunting(sc,x1,y1,x2,y2,z,seed){const cols=[0xe04a3a,0xf2c22a,0x3a8ad8,0x4aa84a,0xd85ab8];const g=new THREE.Group();const n=14;const flags=[];for(let i=0;i<n;i++){const t=(i+.5)/n,x=lerp(x1,x2,t),y=lerp(y1,y2,t)-Math.sin(t*Math.PI)*.5;const f=M(new THREE.ConeGeometry(.16,.4,3),std({color:cols[(i+seed)%5],roughness:.9,side:THREE.DoubleSide}),x,y-.2,z,false);f.rotation.z=Math.PI;f.scale.z=.2;f.userData.noOutline=true;g.add(f);flags.push(f);}
  const pts=[];for(let i=0;i<=20;i++){const t=i/20;pts.push(V3(lerp(x1,x2,t),lerp(y1,y2,t)-Math.sin(t*Math.PI)*.5,z));}g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x3a2a1a})));g.userData.flags=flags;sc.add(g);return g;}

  spots.forEach(s=>{for(let i=0;i<s[6];i++){const u=rr()*Math.PI*2,v=Math.acos(rr()*(o.cap||1.6)-(o.cap||1.6)/2+ (o.off==null?.2:o.off));const d=new THREE.Vector3(Math.sin(v)*Math.cos(u),Math.cos(v),Math.sin(v)*Math.sin(u));
    dm.position.set(s[0]+d.x*s[3]*.96,s[1]+d.y*s[4]*.96,s[2]+d.z*s[5]*.96);const dir=(o.dir?o.dir(d):d.clone());dir.normalize();dm.quaternion.setFromUnitVectors(up,dir);const k=.8+rr()*.7;dm.scale.set(k,k*(.8+rr()*.9),k);dm.updateMatrix();m.setMatrixAt(n,dm.matrix);

    Rt.add(S(M(SPH(.5,14,10),gm,-1.1,.95,s*.8),1,1.2,.9));Rt.add(M(CAP(.3,.6),gm,-1.05,.4,s*.8));Rt.add(S(M(SPH(.46,12,10),gl,-.7,.2,s*.88),1.3,.5,1));});

    const wrap=new THREE.Group();wrap.rotation.y=opt.ry||0;wrap.position.set(opt.x||0,opt.y||0,opt.z||0);wrap.add(m);
    if(opt.hide!==false)g.children.slice().forEach(c=>{if(!(opt.keep&&opt.keep(c)))c.visible=false;});
    g.add(wrap);addOutline(m,.011/s);

  ctx.restore();}

function logical(e){return{x:(e.clientX-view.ox)/view.s,y:(e.clientY-view.oy)/view.s};}
cv.addEventListener('pointermove',e=>{const p=logical(e);G.mouse={x:p.x,y:p.y,in:true};});

  if(e.button===2){cycleVerb();return;}
  for(let i=G.ui.length-1;i>=0;i--){const b=G.ui[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){SFX.click();b.a();return;}}
  if(G.state!=='play')return;
  if(G.msgs.length){G.msgs.shift();return;}
  if(G.end||G.fade>0)return;
  if(p.y<SH&&p.y>0)sceneClick(p.x,p.y);

function cycleVerb(){if(G.sel){G.sel=null;return;}const i=VERBS.findIndex(v=>v.id===G.mode);G.mode=VERBS[(i+1)%VERBS.length].id;}
const KM={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',KeyA:'L',KeyD:'R',KeyW:'U',KeyS:'D'};
addEventListener('keydown',e=>{initAudio();if(KM[e.code]){e.preventDefault();G.keys[KM[e.code]]=1;}
  if(G.state==='play'){if((e.code==='Space'||e.code==='Enter')&&G.msgs.length){e.preventDefault();G.msgs.shift();}
    else if(e.code==='Space'){e.preventDefault();cycleVerb();}
    if(e.code==='Digit1')G.mode='walk',G.sel=null;if(e.code==='Digit2')G.mode='look',G.sel=null;if(e.code==='Digit3')G.mode='take',G.sel=null;if(e.code==='Digit4')G.mode='talk',G.sel=null;if(e.code==='KeyM')setMute(!muted);}
  else if(e.code==='Enter'){const b=G.ui.find(b=>b.main);if(b)b.a();}});
