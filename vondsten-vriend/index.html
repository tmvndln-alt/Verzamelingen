<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mijn Vondsten</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--mute:#6b6b6b;--line:#e0dcd2;--main:#2f5d50;--mainink:#fff;--warn:#b45309;--bad:#b91c1c;--ok:#2f7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#161a18;--card:#1f2523;--ink:#ece9e2;--mute:#9aa39e;--line:#33403b;--main:#5fa88f;--mainink:#10231c;--warn:#f0a85a;--bad:#f08080;--ok:#7fd0a0}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#main{padding:14px 14px 110px;max-width:760px;margin:0 auto}
h1{font-size:1.4rem;margin:.2rem 0 .6rem}h2{font-size:1.15rem;margin:1.2rem 0 .4rem}h3{font-size:1rem;margin:1rem 0 .3rem}
p{margin:.4rem 0}
button,.btn{font:inherit;border:0;border-radius:12px;padding:.8rem 1rem;background:var(--main);color:var(--mainink);font-weight:600;cursor:pointer;min-height:48px}
button.sec,.btn.sec{background:transparent;color:var(--main);border:2px solid var(--main)}
button.danger{background:transparent;color:var(--bad);border:2px solid var(--bad)}
button:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:.6rem 0}.row>*{flex:1 1 150px}
input,textarea,select{font:inherit;width:100%;padding:.7rem;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:90px}
label{display:block;font-size:.85rem;color:var(--mute);margin:.7rem 0 .2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.item{display:flex;gap:12px;align-items:center;cursor:pointer}
.item img,.item .ph{width:76px;height:76px;object-fit:cover;border-radius:10px;background:var(--line);flex:none}
.item .t{font-weight:600}.mute{color:var(--mute);font-size:.88rem}
.nr{font-variant-numeric:tabular-nums;color:var(--main);font-weight:700}
.chip{display:inline-block;font-size:.75rem;padding:.1rem .55rem;border-radius:99px;border:1.5px solid currentColor;margin-left:.3rem;vertical-align:middle}
.chip.wacht{color:var(--mute)}.chip.vragen{color:var(--warn)}.chip.klaar{color:var(--ok)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:.5rem 0}
.thumbs .th{position:relative}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumbs .x{position:absolute;top:-6px;right:-6px;width:28px;height:28px;min-height:0;padding:0;border-radius:50%;background:var(--bad);color:#fff}
.big{width:100%;border-radius:12px;max-height:60vh;object-fit:contain;background:#000}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:transparent;color:var(--mute);border-radius:0;font-size:.78rem;padding:.55rem .2rem;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
nav button span{font-size:1.4rem;line-height:1}nav button.on{color:var(--main)}
#banner{position:fixed;top:0;left:0;right:0;background:var(--main);color:var(--mainink);padding:.6rem 1rem;z-index:9;display:none;font-weight:600;align-items:center;gap:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1rem;border-radius:99px;z-index:10;display:none;max-width:90%}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:20;align-items:center;justify-content:center}#zoom img{max-width:100%;max-height:100%}
.warn{border-left:5px solid var(--warn)}.bad{border-left:5px solid var(--bad)}.good{border-left:5px solid var(--ok)}
.help ol,.help ul{padding-left:1.3rem;margin:.3rem 0}.help li{margin:.35rem 0}.help details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.5rem .8rem;margin:.6rem 0}.help summary{font-weight:700;cursor:pointer;padding:.3rem 0}
.val{font-size:1.15rem;font-weight:700}
.spin{display:inline-block;width:1em;height:1em;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-.15em}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="banner"></div>
<div id="main"></div>
<div id="toast"></div>
<div id="zoom"><img alt=""></div>
<nav id="nav">
  <button data-go="list"><span>📦</span>Vondsten</button>
  <button data-go="new"><span>📷</span>Nieuw</button>
  <button data-go="settings"><span>⚙️</span>Instellingen</button>
  <button data-go="help"><span>❓</span>Hulp</button>
</nav>

<script>
'use strict';
/* ---------- kleine hulpjes ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (n == null || n === '' || isNaN(n)) ? '–' : new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const nrTxt = id => 'Nr. ' + String(id).padStart(4,'0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} }
};
function toast(t){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',2600); }
function setBusy(t){ const b=$('#banner'); if(t){ b.innerHTML='<span class="spin"></span> <span id="btxt"></span>'; $('#btxt').textContent=t; b.style.display='flex'; document.body.style.paddingTop='44px'; } else { b.style.display='none'; document.body.style.paddingTop='0'; } }
function setBusyText(t){ const e=$('#btxt'); if(e) e.textContent=t; }

/* ---------- opslag (IndexedDB) ---------- */
let db;
function openDB(){ return new Promise((res,rej)=>{
  const r = indexedDB.open('vondsten',1);
  r.onupgradeneeded = () => { const d=r.result; d.createObjectStore('finds',{keyPath:'id'}); d.createObjectStore('meta'); };
  r.onsuccess = () => { db=r.result; res(); };
  r.onerror = () => rej(r.error);
});}
const P = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbAll = () => P(db.transaction('finds').objectStore('finds').getAll());
const dbGet = id => P(db.transaction('finds').objectStore('finds').get(id));
const dbPut = f => P(db.transaction('finds','readwrite').objectStore('finds').put(f));
const dbDel = id => P(db.transaction('finds','readwrite').objectStore('finds').delete(id));
async function nextNr(){
  const t = db.transaction('meta','readwrite'), s = t.objectStore('meta');
  const c = (await P(s.get('counter'))) || 0, n = c + 1;
  s.put(n,'counter');
  await new Promise((res,rej)=>{ t.oncomplete=res; t.onerror=()=>rej(t.error); });
  return n;
}
async function raiseCounter(n){
  const t = db.transaction('meta','readwrite'), s = t.objectStore('meta');
  const c = (await P(s.get('counter'))) || 0;
  if(n > c) s.put(n,'counter');
  await new Promise(res => t.oncomplete=res);
}
function markChanged(){ LS.set('vk_changes', String((+LS.get('vk_changes')||0)+1)); }

/* ---------- foto's ---------- */
async function shrink(file, max=1280){
  let bmp;
  try { bmp = await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch { bmp = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const w = bmp.width||bmp.naturalWidth, h = bmp.height||bmp.naturalHeight, s = Math.min(1, max/Math.max(w,h));
  const c = document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r => c.toBlob(r,'image/jpeg',0.82));
}
const toDataURL = b => new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
const fromDataURL = async u => (await fetch(u)).blob();

/* ---------- AI (Gemini) ---------- */
class AIError extends Error { constructor(m,fatal){ super(m); this.fatal=!!fatal; } }
function parseJSON(t){
  t = t.replace(/```json|```/g,'').trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<0) throw new AIError('AI gaf een onleesbaar antwoord. Probeer het nog eens.');
  return JSON.parse(t.slice(a,b+1));
}
async function gemini(parts, json=true){
  const key = (LS.get('vk_key')||'').trim();
  if(!key) throw new AIError('Er is nog geen Google-sleutel ingevuld. Ga naar Instellingen.', true);
  const model = (LS.get('vk_model')||'gemini-flash-latest').trim();
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent';
  const gen = { temperature: 0.3 }; if(json) gen.responseMimeType = 'application/json';
  const waits = [15, 40, 90];
  for(let attempt=0;;attempt++){
    let r;
    try{
      r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
        body: JSON.stringify({contents:[{role:'user',parts}],generationConfig:gen})});
    }catch{
      throw new AIError('Geen verbinding met internet. Probeer het later opnieuw.');
    }
    if(r.ok){
      const j = await r.json();
      const t = (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
      if(!t) throw new AIError('AI gaf geen antwoord (misschien geblokkeerd). Probeer andere foto\'s.');
      return json ? parseJSON(t) : t;
    }
    let msg=''; try{ msg=(await r.json()).error?.message||''; }catch{}
    if((r.status===429||r.status===503) && attempt<waits.length){
      for(let s=waits[attempt]; s>0; s--){ setBusyText('Google vraagt even te wachten… nog '+s+' sec'); await sleep(1000); }
      continue;
    }
    if(r.status===400 && /api key/i.test(msg)) throw new AIError('De sleutel klopt niet. Kopieer hem opnieuw bij Instellingen.', true);
    if(r.status===400 && /billing|location/i.test(msg)) throw new AIError('Google weigert dit: '+msg, true);
    if(r.status===403) throw new AIError('De sleutel mag dit niet gebruiken. Controleer je sleutel en je tegoed bij Google. ('+msg+')', true);
    if(r.status===404) throw new AIError('Dit AI-model bestaat niet (meer). Zet bij Instellingen → Model: gemini-flash-latest', true);
    if(r.status===429) throw new AIError('Limiet of tegoed bij Google is op. Wacht tot morgen of koop tegoed bij (zie Hulp).', true);
    throw new AIError('Fout van Google ('+r.status+'): '+msg);
  }
}
function buildPrompt(f){
  const beantw = (f.vragen||[]).filter(v=>v.antwoord);
  let p = `Je bent een ervaren taxateur en kenner van tweedehands spullen, antiek, curiosa, verzamelobjecten en vondsten (rommelmarkt, zolder, tuin, detector).
Bekijk de foto's van één voorwerp en beoordeel het.

Antwoord ALLEEN met JSON in precies deze vorm:
{"naam":"korte duidelijke naam","categorie":"bv. munt, aardewerk, gereedschap, speelgoed, sieraad, glas, boek, overig","omschrijving":"2 tot 4 zinnen in eenvoudig Nederlands: wat is het, waarvoor gebruikt, opvallende kenmerken, staat","periode":"geschatte tijd of leeg","materiaal":"materiaal of leeg","zekerheid":"hoog|middel|laag","vragen":["..."],"waarde_min":0,"waarde_max":0,"waarde_toelichting":"1 tot 2 zinnen waarom deze waarde"}

Regels:
- Stel alleen vragen (maximaal 3) als het antwoord de herkenning of de waarde echt verandert, bv. afmetingen, gewicht, een stempel of opschrift, waar het gevonden is, of het werkt. Geen vragen als de foto's genoeg zijn: dan "vragen":[].
- Geef ALTIJD toch je beste schatting, ook als je vragen stelt.
- Waarde in euro's: wat het ongeveer opbrengt bij tweedehands verkoop in Nederland (geen nieuwprijs, geen verzekeringswaarde). Gebruik getallen, geen tekst. Is de waarde echt niet te schatten: gebruik null.
- Verzin niets. Twijfel je, zeg dat in de omschrijving en zet zekerheid op "laag".`;
  if(f.note) p += `\n\nOpmerking van de eigenaar: ${f.note}`;
  if(beantw.length) p += `\n\nEerder gestelde vragen met antwoord (stel deze niet opnieuw, nieuwe vragen alleen als echt nodig):\n` + beantw.map(v=>`- ${v.vraag} → ${v.antwoord}`).join('\n');
  return p;
}
async function runAI(id){
  const f = await dbGet(id); if(!f) return;
  const parts = [{text: buildPrompt(f)}];
  for(const b of f.photos) parts.push({inline_data:{mime_type:'image/jpeg', data:(await toDataURL(b)).split(',')[1]}});
  const r = await gemini(parts, true);
  const num = v => (v==null||v==='') ? null : (isNaN(+v) ? null : Math.round(+v));
  f.naam = r.naam || f.naam || 'Onbekend voorwerp';
  f.categorie = r.categorie || '';
  f.omschrijving = r.omschrijving || '';
  f.periode = r.periode || '';
  f.materiaal = r.materiaal || '';
  f.zekerheid = ['hoog','middel','laag'].includes(r.zekerheid) ? r.zekerheid : 'laag';
  f.waarde_min = num(r.waarde_min); f.waarde_max = num(r.waarde_max);
  f.waarde_toelichting = r.waarde_toelichting || '';
  f.vragen = (f.vragen||[]).filter(v=>v.antwoord);
  (Array.isArray(r.vragen)?r.vragen:[]).slice(0,3).forEach(q=>{ if(q) f.vragen.push({vraag:String(q),antwoord:''}); });
  f.status = f.vragen.some(v=>!v.antwoord) ? 'vragen' : 'klaar';
  f.ai_datum = Date.now();
  await dbPut(f); markChanged();
  return f;
}

/* ---------- wachtrij: veel vondsten achter elkaar ---------- */
let cancelQueue = false;
async function runQueue(){
  const todo = (await dbAll()).filter(f=>f.status==='wacht').sort((a,b)=>a.id-b.id);
  if(!todo.length){ toast('Niets te verwerken'); return; }
  cancelQueue = false; let done=0, failed=0, stop='';
  $('#banner').onclick = () => { cancelQueue = true; setBusyText('Stoppen na deze vondst…'); };
  for(const f of todo){
    if(cancelQueue){ stop='Gestopt.'; break; }
    setBusy(`Vondst ${done+failed+1} van ${todo.length} (${nrTxt(f.id)})… tik hier om te stoppen`);
    try{ await runAI(f.id); done++; }
    catch(e){ failed++; if(e.fatal){ stop = e.message; break; } }
    if(view==='list') await render();
    await sleep(1500);
  }
  setBusy(null); $('#banner').onclick = null;
  await render();
  alertBox(`${done} vondst(en) bekeken` + (failed?`, ${failed} mislukt (blijft staan om opnieuw te proberen)`:'') + (stop?`\n\n${stop}`:''));
}
function alertBox(t){ setTimeout(()=>alert(t),50); }

/* ---------- schermen ---------- */
let view='list', currentId=null, filter='alles', search='', draft={photos:[],note:''}, urls=[];
const url = b => { const u=URL.createObjectURL(b); urls.push(u); return u; };
const chip = s => `<span class="chip ${s}">${{wacht:'wacht op AI',vragen:'vragen open',klaar:'klaar'}[s]||s}</span>`;
const waarde = f => (f.waarde_min==null&&f.waarde_max==null) ? '–' : (f.waarde_min===f.waarde_max ? eur(f.waarde_min) : eur(f.waarde_min)+' – '+eur(f.waarde_max));

async function render(){
  urls.forEach(u=>URL.revokeObjectURL(u)); urls=[];
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.go===view || (view==='detail'&&b.dataset.go==='list')));
  const m = $('#main');
  const scroll = window.scrollY;
  if(view==='list') m.innerHTML = await vList();
  else if(view==='new') m.innerHTML = vNew();
  else if(view==='detail') m.innerHTML = await vDetail();
  else if(view==='settings') m.innerHTML = vSettings();
  else m.innerHTML = vHelp();
  if(view==='list') window.scrollTo(0,scroll);
}

async function vList(){
  const all = (await dbAll()).sort((a,b)=>b.id-a.id);
  const q = search.trim().toLowerCase();
  const list = all.filter(f => (filter==='alles'||f.status===filter) &&
    (!q || [f.naam,f.categorie,f.omschrijving,f.note,nrTxt(f.id),String(f.id)].join(' ').toLowerCase().includes(q)));
  const wachtend = all.filter(f=>f.status==='wacht').length;
  const som = all.reduce((s,f)=>s+((f.waarde_min!=null&&f.waarde_max!=null)?(f.waarde_min+f.waarde_max)/2:0),0);
  const dagen = LS.get('vk_lastbackup') ? Math.floor((Date.now()-(+LS.get('vk_lastbackup')))/864e5) : null;
  const changes = +LS.get('vk_changes')||0;
  let nudge='';
  if(all.length && ((dagen===null) || (dagen>=14 && changes>0) || changes>=30))
    nudge = `<div class="card warn"><b>Maak een back-up</b><p class="mute">${dagen===null?'Je hebt nog nooit een back-up gemaakt.':`Laatste back-up: ${dagen} dagen geleden.`} Gaat je telefoon kapot of wist je per ongeluk de browsergegevens, dan zijn je vondsten weg.</p><button data-act="goto-settings">Naar back-up</button></div>`;
  if(!all.length) return `<h1>Mijn vondsten</h1><div class="card"><p>Nog niets opgeslagen.</p><p>Tik hieronder op <b>📷 Nieuw</b> om je eerste vondst te fotograferen.</p>${LS.get('vk_key')?'':'<p><b>Eerst nodig:</b> een Google-sleutel voor de AI. Zie <b>❓ Hulp</b>.</p>'}</div>`;
  return `<h1>Mijn vondsten</h1>
  <p class="mute">${all.length} vondst(en) · geschatte totaalwaarde ongeveer <b>${eur(som)}</b></p>
  ${nudge}
  ${wachtend?`<div class="card good"><b>${wachtend} vondst(en) wachten op de AI</b><div class="row"><button data-act="queue">🤖 Laat AI alles bekijken</button></div></div>`:''}
  <div class="row"><input id="q" type="search" placeholder="Zoeken…" value="${esc(search)}"><select id="flt">
    ${['alles','wacht','vragen','klaar'].map(x=>`<option value="${x}" ${x===filter?'selected':''}>${{alles:'Alles',wacht:'Wacht op AI',vragen:'Vragen open',klaar:'Klaar'}[x]}</option>`).join('')}</select></div>
  ${list.map(f=>`<div class="card item" data-open="${f.id}">
    ${f.photos[0]?`<img src="${url(f.photos[0])}" alt="">`:'<div class="ph"></div>'}
    <div><div><span class="nr">${nrTxt(f.id)}</span> ${chip(f.status)}</div>
    <div class="t">${esc(f.naam||'Nog niet bekeken door AI')}</div>
    <div class="mute">${f.categorie?esc(f.categorie)+' · ':''}${waarde(f)}</div></div></div>`).join('') || '<p class="mute">Niets gevonden met dit filter.</p>'}`;
}

function vNew(){
  return `<h1>Nieuwe vondst</h1>
  <p class="mute">Maak 1 tot 4 foto's van hetzelfde voorwerp: voorkant, achterkant, onderkant, een stempel of opschrift.</p>
  <div class="thumbs">${draft.photos.map((b,i)=>`<div class="th"><img src="${url(b)}" alt=""><button class="x" data-del-draft="${i}">✕</button></div>`).join('')}</div>
  <div class="row">
    <button data-act="cam" ${draft.photos.length>=4?'disabled':''}>📷 Foto maken</button>
    <button class="sec" data-act="gal" ${draft.photos.length>=4?'disabled':''}>🖼️ Uit galerij</button>
  </div>
  <input id="fcam" type="file" accept="image/*" capture="environment" hidden>
  <input id="fgal" type="file" accept="image/*" multiple hidden>
  <label for="dnote">Eigen opmerking (mag leeg): waar gevonden, afmeting, wat je al weet</label>
  <textarea id="dnote">${esc(draft.note)}</textarea>
  <div class="row">
    <button data-act="save-next" ${draft.photos.length?'':'disabled'}>💾 Opslaan, volgende vondst</button>
    <button class="sec" data-act="save-ai" ${draft.photos.length?'':'disabled'}>🤖 Opslaan en nu laten bekijken</button>
  </div>
  <p class="mute">Tip bij veel vondsten: kies steeds “Opslaan, volgende vondst”. Later laat je de AI ze allemaal in één keer bekijken (op het scherm Vondsten).</p>`;
}

async function vDetail(){
  const f = await dbGet(currentId);
  if(!f){ view='list'; return vList(); }
  const open = f.vragen.filter(v=>!v.antwoord), beantw = f.vragen.filter(v=>v.antwoord);
  return `<p><button class="sec" data-go="list" style="min-height:40px">← Terug</button></p>
  <h1><span class="nr">${nrTxt(f.id)}</span> ${chip(f.status)}</h1>
  ${f.photos[0]?`<img class="big" src="${url(f.photos[0])}" data-zoom alt="">`:''}
  <div class="thumbs">${f.photos.map((b,i)=>`<div class="th"><img src="${url(b)}" data-zoom alt="">${f.photos.length>1?`<button class="x" data-del-photo="${i}">✕</button>`:''}</div>`).join('')}
    ${f.photos.length<4?`<div class="th"><button class="sec" data-act="addphoto" style="width:84px;height:84px">+ foto</button></div>`:''}</div>
  <input id="fadd" type="file" accept="image/*" capture="environment" hidden>
  <div class="row"><button data-act="ai">${f.status==='wacht'?'🤖 Laat AI kijken':'🤖 Opnieuw laten kijken'}</button></div>
  ${f.status==='klaar'||f.status==='vragen'?`<div class="card"><div class="mute">Geschatte waarde (tweedehands)</div><div class="val">${waarde(f)}</div>
    <div class="mute">Zekerheid AI: ${esc(f.zekerheid||'?')}</div>${f.waarde_toelichting?`<p class="mute">${esc(f.waarde_toelichting)}</p>`:''}
    <p class="mute">Dit is een schatting van een computer, geen taxatie. Laat iets dat veel waard lijkt altijd door een kenner beoordelen.</p></div>`:''}
  ${open.length?`<div class="card warn"><b>De AI heeft vragen</b><p class="mute">Beantwoord wat je weet. Laat leeg wat je niet weet.</p>
    ${open.map(v=>`<label>${esc(v.vraag)}</label><input data-q="${f.vragen.indexOf(v)}" value="">`).join('')}
    <div class="row"><button data-act="answer">Antwoorden doorgeven aan AI</button><button class="sec" data-act="skipq">Vragen overslaan</button></div></div>`:''}
  ${beantw.length?`<div class="card"><b>Beantwoorde vragen</b>${beantw.map(v=>`<p class="mute">${esc(v.vraag)}<br><b>${esc(v.antwoord)}</b></p>`).join('')}</div>`:''}
  <label>Naam</label><input data-f="naam" value="${esc(f.naam)}">
  <label>Categorie</label><input data-f="categorie" value="${esc(f.categorie)}">
  <label>Omschrijving</label><textarea data-f="omschrijving">${esc(f.omschrijving)}</textarea>
  <div class="row"><div><label>Periode</label><input data-f="periode" value="${esc(f.periode)}"></div><div><label>Materiaal</label><input data-f="materiaal" value="${esc(f.materiaal)}"></div></div>
  <div class="row"><div><label>Waarde van (€)</label><input data-f="waarde_min" inputmode="numeric" value="${f.waarde_min??''}"></div><div><label>Waarde tot (€)</label><input data-f="waarde_max" inputmode="numeric" value="${f.waarde_max??''}"></div></div>
  <label>Eigen opmerking</label><textarea data-f="note">${esc(f.note)}</textarea>
  <p class="mute">Wijzigingen worden meteen bewaard. Laat je de AI opnieuw kijken, dan worden de velden hierboven opnieuw ingevuld.</p>
  <div class="row"><button class="danger" data-act="delete">🗑️ Vondst verwijderen</button></div>`;
}

function vSettings(){
  const k = LS.get('vk_key')||'', last = LS.get('vk_lastbackup');
  return `<h1>Instellingen</h1>
  <div class="card"><h3>Google-sleutel (voor de AI)</h3>
  <p class="mute">Deze sleutel blijft alleen op deze telefoon. Hoe je hem krijgt staat bij <b>❓ Hulp</b>, deel A.</p>
  <label for="key">Sleutel</label><input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(k)}" placeholder="begint meestal met AIza…">
  <div class="row"><button data-act="savekey">Sleutel bewaren</button><button class="sec" data-act="testkey">Sleutel testen</button></div>
  <label for="model">Model (laat staan als alles werkt)</label><input id="model" value="${esc(LS.get('vk_model')||'gemini-flash-latest')}">
  </div>
  <div class="card"><h3>Back-up</h3>
  <p class="mute">${last?'Laatste back-up: '+new Date(+last).toLocaleDateString('nl-NL'):'Nog geen back-up gemaakt.'} Maak elke week een back-up en bewaar het bestand buiten je telefoon (mail het naar jezelf of zet het in je cloud).</p>
  <div class="row"><button data-act="export">💾 Back-up maken (met foto's)</button><button class="sec" data-act="csv">📊 Lijst voor Excel</button></div>
  <label>Back-up terugzetten (vervangt alles op deze telefoon)</label>
  <input id="imp" type="file" accept=".json,application/json">
  </div>
  <div class="card"><h3>Opslag</h3><p class="mute" id="stor">Bezig met controleren…</p></div>`;
}

function vHelp(){ return $('#helptpl').innerHTML; }

/* ---------- acties ---------- */
const files = async (list, target) => {
  for(const f of list){ if(target.length>=4) break; target.push(await shrink(f)); }
};
async function saveDraft(thenAI){
  if(!draft.photos.length) return;
  draft.note = ($('#dnote')?.value)||draft.note;
  const id = await nextNr();
  await dbPut({id, created:Date.now(), status:'wacht', photos:draft.photos, note:draft.note.trim(),
    naam:'',categorie:'',omschrijving:'',periode:'',materiaal:'',zekerheid:'',waarde_min:null,waarde_max:null,waarde_toelichting:'',vragen:[]});
  markChanged(); draft={photos:[],note:''};
  if(thenAI){ currentId=id; view='detail'; await render(); window.scrollTo(0,0); await doAI(id); }
  else { toast(nrTxt(id)+' opgeslagen'); await render(); }
}
async function doAI(id){
  setBusy('AI bekijkt de foto\'s…');
  try{ await runAI(id); toast('Klaar'); }
  catch(e){ alertBox(e.message); }
  setBusy(null); await render();
}
function dl(name, blob){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
async function exportAll(){
  setBusy('Back-up maken…');
  try{
    const all = await dbAll(), out=[];
    for(const f of all) out.push({...f, photos: await Promise.all(f.photos.map(toDataURL))});
    const counter = (await P(db.transaction('meta').objectStore('meta').get('counter')))||0;
    const blob = new Blob([JSON.stringify({app:'vondsten',versie:1,counter,finds:out})],{type:'application/json'});
    const name = 'vondsten-backup-'+new Date().toISOString().slice(0,10)+'.json';
    const file = new File([blob],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:name}); }catch(e){ if(e.name==='AbortError'){ setBusy(null); return; } dl(name,blob); }
    } else dl(name,blob);
    LS.set('vk_lastbackup',String(Date.now())); LS.set('vk_changes','0');
    toast('Back-up gemaakt');
  }catch(e){ alertBox('Back-up mislukt: '+e.message); }
  setBusy(null); await render();
}
async function exportCSV(){
  const all=(await dbAll()).sort((a,b)=>a.id-b.id);
  const cols=[['Nr','id'],['Naam','naam'],['Categorie','categorie'],['Omschrijving','omschrijving'],['Periode','periode'],['Materiaal','materiaal'],['Waarde van','waarde_min'],['Waarde tot','waarde_max'],['Zekerheid','zekerheid'],['Opmerking','note'],['Datum',null]];
  const q=v=>'"'+String(v??'').replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';
  const lines=[cols.map(c=>q(c[0])).join(';')];
  for(const f of all) lines.push(cols.map(([,k])=>q(k?f[k]:new Date(f.created).toLocaleDateString('nl-NL'))).join(';'));
  dl('vondsten-lijst.csv', new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'}));
}
async function importAll(file){
  try{
    const j = JSON.parse(await file.text());
    if(j.app!=='vondsten'||!Array.isArray(j.finds)) throw new Error('Dit is geen back-upbestand van deze app.');
    if(!confirm(`Er staan ${j.finds.length} vondsten in dit bestand. Alles op deze telefoon wordt vervangen. Doorgaan?`)) return;
    setBusy('Terugzetten…');
    for(const f of await dbAll()) await dbDel(f.id);
    for(const f of j.finds){ f.photos = await Promise.all(f.photos.map(fromDataURL)); await dbPut(f); }
    await raiseCounter(Math.max(j.counter||0, ...j.finds.map(f=>f.id),0));
    LS.set('vk_lastbackup',String(Date.now())); LS.set('vk_changes','0');
    toast('Teruggezet');
  }catch(e){ alertBox('Terugzetten mislukt: '+e.message); }
  setBusy(null); view='list'; await render();
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target;
  const go = t.closest('[data-go]'); if(go){ view=go.dataset.go; await render(); window.scrollTo(0,0); if(view==='settings') storageInfo(); return; }
  const op = t.closest('[data-open]'); if(op){ currentId=+op.dataset.open; view='detail'; await render(); window.scrollTo(0,0); return; }
  const z = t.closest('[data-zoom]'); if(z){ $('#zoom img').src=z.src; $('#zoom').style.display='flex'; return; }
  if(t.closest('#zoom')){ $('#zoom').style.display='none'; return; }
  const dd = t.closest('[data-del-draft]'); if(dd){ draft.photos.splice(+dd.dataset.delDraft,1); draft.note=$('#dnote').value; await render(); return; }
  const dp = t.closest('[data-del-photo]'); if(dp){ if(!confirm('Deze foto verwijderen?')) return; const f=await dbGet(currentId); f.photos.splice(+dp.dataset.delPhoto,1); await dbPut(f); markChanged(); await render(); return; }
  const a = t.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(act==='cam') $('#fcam').click();
  else if(act==='gal') $('#fgal').click();
  else if(act==='save-next') await saveDraft(false);
  else if(act==='save-ai') await saveDraft(true);
  else if(act==='queue') await runQueue();
  else if(act==='goto-settings'){ view='settings'; await render(); storageInfo(); }
  else if(act==='ai'){ const f=await dbGet(currentId); if(f.status==='klaar' && !confirm('De AI vult de velden opnieuw in. Je eigen wijzigingen gaan dan verloren. Doorgaan?')) return; await doAI(currentId); }
  else if(act==='addphoto') $('#fadd').click();
  else if(act==='answer'){
    const f=await dbGet(currentId);
    document.querySelectorAll('[data-q]').forEach(i=>{ if(i.value.trim()) f.vragen[+i.dataset.q].antwoord=i.value.trim(); });
    await dbPut(f);
    if(f.vragen.some(v=>v.antwoord)) await doAI(currentId); else toast('Vul minstens één antwoord in');
  }
  else if(act==='skipq'){ const f=await dbGet(currentId); f.vragen=f.vragen.filter(v=>v.antwoord); f.status='klaar'; await dbPut(f); markChanged(); await render(); }
  else if(act==='delete'){ if(confirm('Deze vondst definitief verwijderen? Het nummer wordt niet opnieuw gebruikt.')){ await dbDel(currentId); markChanged(); view='list'; await render(); } }
  else if(act==='savekey'){ LS.set('vk_key',$('#key').value.trim()); LS.set('vk_model',$('#model').value.trim()||'gemini-flash-latest'); toast('Bewaard'); }
  else if(act==='testkey'){
    LS.set('vk_key',$('#key').value.trim()); LS.set('vk_model',$('#model').value.trim()||'gemini-flash-latest');
    setBusy('Sleutel testen…');
    try{ await gemini([{text:'Antwoord met alleen het woord: ok'}], false); setBusy(null); alert('✅ De sleutel werkt!'); }
    catch(err){ setBusy(null); alert('❌ '+err.message); }
  }
  else if(act==='export') await exportAll();
  else if(act==='csv') await exportCSV();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if(t.id==='fcam'||t.id==='fgal'){ draft.note=$('#dnote').value; setBusy('Foto verwerken…'); await files([...t.files], draft.photos); setBusy(null); await render(); }
  else if(t.id==='fadd'){ const f=await dbGet(currentId); setBusy('Foto verwerken…'); await files([...t.files], f.photos); await dbPut(f); markChanged(); setBusy(null); await render(); }
  else if(t.id==='flt'){ filter=t.value; await render(); }
  else if(t.id==='imp'){ if(t.files[0]) await importAll(t.files[0]); }
  else if(t.dataset.f){
    const f=await dbGet(currentId); let v=t.value;
    if(t.dataset.f.startsWith('waarde_')) v = v.trim()==='' ? null : (isNaN(+v.replace(',','.'))?null:Math.round(+v.replace(',','.')));
    f[t.dataset.f]=v; await dbPut(f); markChanged(); toast('Bewaard');
  }
});
document.addEventListener('input', e => {
  if(e.target.id==='q'){ search=e.target.value; clearTimeout(window._qt); window._qt=setTimeout(async()=>{ await render(); const q=$('#q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); },250); }
});
async function storageInfo(){
  const el=$('#stor'); if(!el) return;
  let txt='';
  try{
    if(navigator.storage?.persist){ const ok = await navigator.storage.persist(); txt += ok?'✅ De telefoon bewaart je gegevens vast. ':'⚠️ De telefoon kan oude gegevens opruimen als hij vol zit. Maak dus back-ups. '; }
    if(navigator.storage?.estimate){ const s=await navigator.storage.estimate(); txt += `Gebruikt: ${(s.usage/1048576).toFixed(0)} MB.`; }
  }catch{}
  el.textContent = txt || 'Geen informatie beschikbaar.';
}

/* ---------- start ---------- */
(async()=>{
  try{ await openDB(); }catch(e){ document.body.innerHTML='<p style="padding:20px">Opslaan lukt niet in deze browser. Gebruik Safari (iPhone) of Chrome (Android), niet een privé-venster.</p>'; return; }
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
  await render();
})();
</script>

<template id="helptpl">
<div class="help">
<h1>Hulp</h1>
<p>Lees dit één keer van boven naar beneden. Het duurt ongeveer 15 minuten.</p>

<details open><summary>Stap voor stap: van nul naar je eerste vondst</summary>
<ol>
<li><b>Zet de app op je beginscherm.</b>
  <ul><li><b>iPhone:</b> open de link in <b>Safari</b>. Tik op de deel-knop (vierkantje met pijl) en kies <b>Zet op beginscherm</b>.</li>
  <li><b>Android:</b> open de link in <b>Chrome</b>. Tik op de drie puntjes ⋮ en kies <b>App installeren</b> of <b>Toevoegen aan startscherm</b>.</li></ul></li>
<li><b>Sluit de browser en open de app via het nieuwe icoontje.</b> Doe vanaf nu alles in dat icoontje. <i>Belangrijk op iPhone: de app op het beginscherm en Safari hebben aparte opslag. Vul je sleutel dus pas in nadat je de app via het icoontje geopend hebt.</i></li>
<li><b>Haal een Google-sleutel</b> (deel A hieronder) en <b>zet er tegoed op</b> (deel B).</li>
<li>Ga in de app naar <b>⚙️ Instellingen</b>, plak de sleutel, tik <b>Sleutel bewaren</b> en daarna <b>Sleutel testen</b>. Je moet “✅ De sleutel werkt!” zien.</li>
<li>Tik op <b>📷 Nieuw</b>, maak foto’s van je vondst en tik op <b>Opslaan en nu laten bekijken</b>. Na een paar seconden staat er een naam, omschrijving en waarde.</li>
<li>Heeft de AI vragen? Vul in wat je weet en tik op <b>Antwoorden doorgeven aan AI</b>.</li>
<li>Maak <b>elke week een back-up</b> (Instellingen → Back-up maken).</li>
</ol></details>

<details><summary>Deel A: een Google-sleutel krijgen</summary>
<p>De sleutel is als een wachtwoord waarmee jouw app de AI van Google mag gebruiken. Je maakt hem gratis.</p>
<ol>
<li>Ga naar <b>aistudio.google.com</b> en log in met je Google-account.</li>
<li>Accepteer de voorwaarden als dat gevraagd wordt.</li>
<li>Kies <b>Get API key</b> (API-sleutel ophalen) en dan <b>Create API key</b> (sleutel maken). Kies <b>Create project</b> (nieuw project) als Google daarom vraagt.</li>
<li>Tik op <b>Kopiëren</b> naast de sleutel. Hij begint meestal met <b>AIza</b>.</li>
<li>Plak hem in de app bij Instellingen. Bewaar hem ook ergens veilig, bijvoorbeeld in je wachtwoordkluis.</li>
</ol>
<p><b>Deel de sleutel nooit</b> met anderen. Wie hem heeft, kan op jouw rekening AI gebruiken. Is hij toch uitgelekt? Verwijder hem in Google AI Studio en maak een nieuwe.</p>
<p class="mute">Google past de schermen en knopnamen vaak aan. Vind je een knop niet, zoek dan in AI Studio op “API key”.</p></details>

<details><summary>Deel B: tegoed kopen (prepaid)</summary>
<p>Zonder tegoed werkt de AI ook, maar met een lage daglimiet. Bij veel vondsten loop je daar snel tegenaan. Volgens Google mag het gratis gebruik ook gebruikt worden om hun producten te verbeteren; bij betaald gebruik niet. Lees hun voorwaarden als dat voor jou belangrijk is.</p>
<ol>
<li>Ga in <b>aistudio.google.com</b> naar je sleutels/projecten (menu aan de zijkant: <b>API keys</b> of <b>Dashboard</b>).</li>
<li>Zoek naast je project de knop <b>Set up billing</b> (facturering instellen), of een onderdeel <b>Billing</b>/<b>Credits</b>.</li>
<li>Kies de <b>prepaid</b>-optie (tegoed vooruit kopen) als je die ziet, en voeg een betaalmethode toe.</li>
<li>Koop een klein bedrag, bijvoorbeeld <b>€ 10</b>.</li>
<li>Zet <b>automatisch bijvullen UIT</b>. Dan kan er nooit meer worden afgeschreven dan jij vooraf hebt gekocht.</li>
<li>Kijk af en toe bij <b>Usage</b>/<b>Billing</b> hoeveel er gebruikt is.</li>
</ol>
<p><b>Wat kost het?</b> Rekenvoorbeeld, ongeveer: een vondst met 2 foto’s kost een fractie van een cent tot ongeveer een cent. Honderd vondsten is dan meestal minder dan een paar euro. De prijzen veranderen; kijk op <b>ai.google.dev/pricing</b>.</p>
<p class="mute">Lukt het niet? Zoek op Google naar “Gemini API prepay credits” voor de nieuwste uitleg.</p></details>

<details><summary>Zo werkt de app</summary>
<ul>
<li><b>Volgnummer:</b> elke vondst krijgt automatisch een nummer (Nr. 0001, 0002…). Een verwijderd nummer komt nooit terug.</li>
<li><b>Veel vondsten achter elkaar:</b> gebruik <b>Opslaan, volgende vondst</b>. Heb je er een stapel gedaan, ga dan naar <b>Vondsten</b> en tik <b>Laat AI alles bekijken</b>. Laat de app open en het scherm aan. Tik op de balk bovenin om te stoppen.</li>
<li><b>Statussen:</b> <i>wacht op AI</i> (foto’s opgeslagen), <i>vragen open</i> (AI wil iets weten), <i>klaar</i>.</li>
<li><b>Aanpassen:</b> tik op een vondst. Je kunt alles zelf verbeteren. Het wordt meteen bewaard.</li>
<li><b>Zoeken:</b> bovenaan Vondsten, op naam, soort of nummer.</li>
<li><b>Excel:</b> Instellingen → Lijst voor Excel geeft een tabel (zonder foto’s).</li>
</ul></details>

<details><summary>Betere resultaten met betere foto’s</summary>
<ul>
<li>Goed licht, liefst daglicht. Effen achtergrond.</li>
<li>Maak ook foto’s van <b>de onderkant, stempels, letters en nummers</b>. Daar zit vaak de informatie.</li>
<li>Leg een munt of liniaal ernaast voor de grootte.</li>
<li>Staat er iets in over waar je het vond? Zet dat bij “Eigen opmerking”.</li>
</ul></details>

<details><summary>De waarde: wat moet je weten?</summary>
<p>De AI schat wat het ongeveer opbrengt bij tweedehands verkoop in Nederland. Het is een <b>schatting op basis van foto’s</b>, geen taxatie. Bij zeldzame of dure spullen kan de AI er ver naast zitten. Laat iets dat veel waard lijkt altijd beoordelen door een kenner of veiling.</p></details>

<details><summary>Problemen oplossen</summary>
<ul>
<li><b>“De sleutel klopt niet”:</b> kopieer de sleutel opnieuw, zonder spaties ervoor of erna.</li>
<li><b>“Limiet of tegoed is op”:</b> koop tegoed (deel B) of wacht tot morgen.</li>
<li><b>“Google vraagt even te wachten”:</b> normaal; de app probeert het vanzelf opnieuw.</li>
<li><b>“Model bestaat niet”:</b> Instellingen → Model → typ <i>gemini-flash-latest</i>.</li>
<li><b>Vondsten zijn weg:</b> zet de laatste back-up terug (Instellingen → Back-up terugzetten). Wis daarom nooit de “websitegegevens” van deze app in je telefoon-instellingen.</li>
<li><b>Nieuwe telefoon:</b> maak een back-up, installeer de app op de nieuwe telefoon, vul de sleutel opnieuw in en zet de back-up terug.</li>
</ul></details>
</div>
</template>
